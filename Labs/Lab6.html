<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 06: Like, Dislike and Comments</title>
  <style>
    body {
      text-align: center;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .vote-btn {
      font-size: 48px;
      padding: 10px 40px;
      margin: 0 10px;
      background-color: #e8e8ed;
      border: 1px solid #aaa;
      border-radius: 6px;
      cursor: pointer;
    }

    .vote-btn:hover:enabled {
      background-color: #d8d8e0;
    }

    .vote-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* the button the user voted for */
    .vote-btn.selected {
      opacity: 1;
      border: 3px solid #1d428a;
    }

    /* animation for the like and dislike buttons */
    .vote-btn.pop {
      animation: pop 0.3s;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    #comment-input {
      width: 80%;
      height: 200px;
      padding: 12px;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .action-btn {
      font-size: 20px;
      padding: 14px 36px;
      margin: 10px 8px;
      color: #fff;
      background-color: #555;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .action-btn:hover:enabled {
      background-color: #222;
    }

    .action-btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #message {
      min-height: 24px;
      color: #1d428a;
      font-weight: bold;
    }

    #comments-list {
      width: 80%;
      margin: 0 auto;
      text-align: left;
    }

    .comment {
      padding: 10px 14px;
      margin: 8px 0;
      background-color: #f4f4f4;
      border-left: 4px solid #555;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <h1>Lab 6</h1>
  <h2>Like or dislike</h2>

  <div>
    <button id="like-btn" class="vote-btn">👍<span id="like-count">100</span></button>
    <button id="dislike-btn" class="vote-btn">👎<span id="dislike-count">20</span></button>
  </div>

  <p id="message"></p>

  <h3>Comments</h3>
  <textarea id="comment-input" placeholder="Write a comment..." maxlength="200"></textarea>
  <div>
    <button id="submit-btn" class="action-btn">Submit</button>
    <button id="clear-btn" class="action-btn">Clear</button>
  </div>

  <div id="comments-list"></div>

  <script>
    // ===================== State =====================
    var likes = 100;
    var dislikes = 20;
    var comments = [];

    // ===================== Elements =====================
    var likeBtn = document.getElementById("like-btn");
    var dislikeBtn = document.getElementById("dislike-btn");
    var likeCount = document.getElementById("like-count");
    var dislikeCount = document.getElementById("dislike-count");
    var commentInput = document.getElementById("comment-input");
    var submitBtn = document.getElementById("submit-btn");
    var clearBtn = document.getElementById("clear-btn");
    var commentsList = document.getElementById("comments-list");
    var message = document.getElementById("message");

    // ===================== Cookies =====================
    // Sets a cookie that expires after the given number of days
    function setCookie(name, value, days) {
      document.cookie = name + "=" + encodeURIComponent(value) +
        "; max-age=" + days * 24 * 60 * 60 + "; path=/";
    }

    // Reads a cookie by name, returns null if it does not exist
    function getCookie(name) {
      var myCookies = document.cookie.split(";");
      for (var i = 0; i < myCookies.length; i++) {
        var pair = myCookies[i].trim().split("=");
        if (pair[0] == name) {
          return decodeURIComponent(pair[1]);
        }
      }
      return null;
    }

    // Deletes a cookie by setting its expiration date to a past date
    function deleteCookie(name) {
      document.cookie = name + "=; expires=" + new Date(2000, 0, 1).toUTCString() + "; path=/";
    }

    // ===================== UI =====================
    function showMessage(text) {
      message.textContent = text;
    }

    // Updates the counters, the buttons, and the comments section
    function updateUI() {
      likeCount.textContent = likes;
      dislikeCount.textContent = dislikes;

      // the user has voted: disable both buttons and highlight the chosen one
      var vote = getCookie("vote");
      likeBtn.disabled = vote != null;
      dislikeBtn.disabled = vote != null;
      likeBtn.classList.toggle("selected", vote == "like");
      dislikeBtn.classList.toggle("selected", vote == "dislike");

      // the user has commented: the comment box can not be used again
      var hasCommented = comments.length > 0;
      commentInput.disabled = hasCommented;
      submitBtn.disabled = hasCommented;

      // display the comments using the DOM API
      commentsList.innerHTML = "";
      comments.forEach(function (comment) {
        var div = document.createElement("div");
        div.className = "comment";
        div.appendChild(document.createTextNode(comment));
        commentsList.appendChild(div);
      });
    }

    // ===================== Like / Dislike =====================
    function handleVote(choice) {
      // a cookie exists, so the user has already voted
      if (getCookie("vote") != null) {
        showMessage("You have already voted.");
        return;
      }

      var button;
      if (choice == "like") {
        likes++;
        button = likeBtn;
      } else {
        dislikes++;
        button = dislikeBtn;
      }

      // store the choice for 1 year
      setCookie("vote", choice, 365);
      updateUI();
      showMessage("Thanks for your vote!");

      // animation
      button.classList.add("pop");
      button.addEventListener("animationend", function () {
        button.classList.remove("pop");
      });
    }

    // ===================== Comments =====================
    function handleSubmit() {
      var text = commentInput.value.trim();

      if (comments.length > 0) {
        showMessage("You have already commented.");
        return;
      }
      if (text == "") {
        showMessage("Please write a comment first.");
        return;
      }

      comments.push(text);
      // cookies store strings, so the array is converted to JSON
      setCookie("comments", JSON.stringify(comments), 365);

      commentInput.value = "";
      updateUI();
      showMessage("Your comment was added.");
    }

    // ===================== Reset =====================
    function handleClear() {
      deleteCookie("vote");
      deleteCookie("comments");

      likes = 100;
      dislikes = 20;
      comments = [];

      commentInput.value = "";
      updateUI();
      showMessage("Your vote and comments were cleared. You can vote again.");
    }

    // ===================== Event listeners =====================
    likeBtn.addEventListener("click", function () {
      handleVote("like");
    });
    dislikeBtn.addEventListener("click", function () {
      handleVote("dislike");
    });
    submitBtn.addEventListener("click", handleSubmit);
    clearBtn.addEventListener("click", handleClear);

    // ===================== Initial load =====================
    // Apply the state stored in the cookies when the page loads
    var savedVote = getCookie("vote");
    if (savedVote == "like") {
      likes++;
    } else if (savedVote == "dislike") {
      dislikes++;
    }

    var savedComments = getCookie("comments");
    if (savedComments != null) {
      comments = JSON.parse(savedComments);
    }

    updateUI();
  </script>
</body>
</html>
