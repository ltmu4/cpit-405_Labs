<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab 03: CSS Structure and Properties</title>

  <style>
    /*Question 1*/
    .image-preview img {
      border-style: solid;
      border-width: 30px;
      border-top-color: skyblue;
      border-left-color: #ffefd5;
      border-right-color: lightpink;
      border-bottom-color: lightgreen;
    }

    /*Question 2*/
    p > span { color: red; }
    #header span { color: pink; }
    span { color: green; }
    #header *:last-child { color: orange; }
    #header span:first-child:hover { color: blue; }

    /* Table styling (only for the answer table) */
    table.answer { border-collapse: collapse; margin-top: 20px; }
    table.answer th, table.answer td { padding: 8px 16px; text-align: left; }
  </style>
</head>

<body>

  <h2>Question 1</h2>
  <div class="image-preview">
    <img src="https://cpit405.gitlab.io/images/KAU_logo.png">
  </div>

  <hr>

  <h2>Question 2</h2>

  <div id="header">
    <span class="myclass1">Every</span>
    <span class="myclass2">one can</span>
    <span class="myclass3">success.</span>
  </div>
  <p> One machine can do the work of fifty ordinary men.
    <span class="myclass4">No machine can do the work of one extraordinary man.</span>
  </p>

  <h3>Answer table</h3>
  <table class="answer" border="1">
    <tr>
      <th></th>
      <th>color</th>
      <th>color when mouse over</th>
    </tr>
    <tr>
      <td>span.myclass1</td>
      <td>pink</td>
      <td>blue</td>
    </tr>
    <tr>
      <td>span.myclass2</td>
      <td>pink</td>
      <td>pink</td>
    </tr>
    <tr>
      <td>span.myclass3</td>
      <td>orange</td>
      <td>orange</td>
    </tr>
    <tr>
      <td>span.myclass4</td>
      <td>red</td>
      <td>red</td>
    </tr>
  </table>

</body>
</html>
