<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Lab 5</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #search {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 200px;
            margin-right: 10px;
        }

        #team-filter {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 150px;
        }

        .table-filters {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            cursor: pointer;
        }

        .dark-mode {
            background-color: #333;
            color: #f4f4f4;
        }

        .dark-mode table {
            border-color: #555;
        }

        .dark-mode th,
        .dark-mode td {
            border-color: #555;
        }

        /* Highlight table row */
        .highlight-row {
            background-color: #d6eaff;
        }

        /* Dark mode button */
        button {
            padding: 10px 15px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        /* Table header */
        th {
            background-color: #eeeeee;
        }

        /* Table rows */
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* Dark mode table header */
        .dark-mode th {
            background-color: #444;
            color: white;
        }

        /* Dark mode highlight */
        .dark-mode .highlight-row {
            background-color: #555;
            color: white;
        }
    </style>

</head>

                <!-- Teams will be populated in JS -->

            { name: "Jrue Holiday", team: "Boston Celtics (BOS)", points: 13.2, rebounds: 6.1, assists: 4.4, blocks: 0.6, turnovers: 1.5 }
        ];

        // Get HTML elements
        let searchInput = document.getElementById("search");
        let teamFilter = document.getElementById("team-filter");
        let playerRows = document.getElementById("player-rows");
        let darkModeButton = document.getElementById("dark-mode-toggle");

        // Display players in the table
        function displayPlayers(players) {

            // Clear the table
            playerRows.innerHTML = "";

            // Loop through players
            for (let i = 0; i < players.length; i++) {

                let player = players[i];

                // Create table row
                let row = document.createElement("tr");

                // Create table cells
                let nameCell = document.createElement("td");
                let teamCell = document.createElement("td");
                let pointsCell = document.createElement("td");
                let reboundsCell = document.createElement("td");
                let assistsCell = document.createElement("td");

                // Add player information
                nameCell.innerText = player.name;
                teamCell.innerText = player.team;
                pointsCell.innerText = player.points;
                reboundsCell.innerText = player.rebounds;
                assistsCell.innerText = player.assists;

                // Add cells to the row
                row.appendChild(nameCell);
                row.appendChild(teamCell);
                row.appendChild(pointsCell);
                row.appendChild(reboundsCell);
                row.appendChild(assistsCell);

                // Add row to the table
                playerRows.appendChild(row);
            }
        }

        // Add teams to the filter
        function populateTeamFilter() {

            let teams = [];

            for (let i = 0; i < data.length; i++) {

                let team = data[i].team;

                if (teams.indexOf(team) === -1) {
                    teams.push(team);
                }
            }

            for (let i = 0; i < teams.length; i++) {

                let option = document.createElement("option");

                option.value = teams[i];
                option.innerText = teams[i];

                teamFilter.appendChild(option);
            }
        }

        // Search and filter players
        function filterPlayers() {

            let searchValue = searchInput.value.toLowerCase();
            let selectedTeam = teamFilter.value;

            let filteredPlayers = [];

            for (let i = 0; i < data.length; i++) {

                let player = data[i];

                let playerName = player.name.toLowerCase();

                let matchesSearch = playerName.includes(searchValue);

                let matchesTeam = selectedTeam === "all" ||
                                  player.team === selectedTeam;

                if (matchesSearch && matchesTeam) {
                    filteredPlayers.push(player);
                }
            }

            displayPlayers(filteredPlayers);
        }

        // Search event
        searchInput.addEventListener("input", filterPlayers);

        // Team filter event
        teamFilter.addEventListener("change", filterPlayers);

        // Dark mode event
        darkModeButton.addEventListener("click", function() {

            document.body.classList.toggle("dark-mode");

        });

        // Mouse over event using event delegation
        playerRows.addEventListener("mouseover", function(event) {

            let row = event.target.closest("tr");

            if (row && playerRows.contains(row)) {
                row.classList.add("highlight-row");
            }

        });

        // Mouse out event using event delegation
        playerRows.addEventListener("mouseout", function(event) {

            let row = event.target.closest("tr");

            if (row && !row.contains(event.relatedTarget)) {
                row.classList.remove("highlight-row");
            }

        });

        // Start the page
        populateTeamFilter();
        displayPlayers(data);
    </script>

</html>
