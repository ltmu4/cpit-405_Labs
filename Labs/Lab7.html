<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsplash API</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 20px;
      background: #f8f9fa;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0 10px 0 0;
      font-size: 20px;
    }

    #inputBox {
      width: 280px;
      max-width: 100%;
      padding: 9px 12px;
      font-size: 13px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    button {
      padding: 9px 12px;
      font-size: 12px;
      color: #fff;
      background: #444;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #222;
    }

    #gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }

    #gallery img {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    @media (max-width: 800px) {
      #gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Unsplash API</h1>
    <input id="inputBox" type="text" placeholder="Type what you want to search for">
    <button onclick="searchUsingXHR()">Search using XHR</button>
    <button onclick="searchUsingFetch()">Search using fetch (promises)</button>
    <button onclick="searchUsingFetchAwaitAsync()">Search using fetch (async/await)</button>
  </header>

  <div id="gallery"></div>

  <script>
    var ACCESS_KEY = "lx-HfDU6pu8Cbbwo73LYFoZ814ZBTNFUY9f2WbMWIhg";
    var API_URL = "https://api.unsplash.com/search/photos?per_page=12&query=";

    // Creates one <img> element for every photo using the DOM API
    function showImages(data) {
        var gallery = document.getElementById("gallery");
        gallery.innerHTML = "";

        data.results.forEach(function (photo) {
            var img = document.createElement("img");
            img.src = photo.urls.regular;
            img.alt = photo.alt_description || "Unsplash photo";
            // Mouse event: clicking a photo opens the full size in a new tab
            img.addEventListener("click", function () {
                window.open(photo.urls.full, "_blank");
            });
            gallery.appendChild(img);
        });
    }

    function searchUsingXHR() {
        var query = document.getElementById("inputBox").value;

        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
            // When the request is successful, finished, and response is ready
            if (this.readyState == 4 && this.status == 200) {
                showImages(JSON.parse(xhr.responseText));
            }
        };
        xhr.open("GET", API_URL + encodeURIComponent(query), true);
        xhr.setRequestHeader("Authorization", "Client-ID " + ACCESS_KEY);
        xhr.send();
    }

    function searchUsingFetch() {
        var query = document.getElementById("inputBox").value;

        fetch(API_URL + encodeURIComponent(query), {
            headers: { Authorization: "Client-ID " + ACCESS_KEY }
        })
            .then(response => {
                return response.json();
            })
            .then(data => {
                showImages(data);
            });
    }

    async function searchUsingFetchAwaitAsync() {
        var query = document.getElementById("inputBox").value;

        let response = await fetch(API_URL + encodeURIComponent(query), {
            headers: { Authorization: "Client-ID " + ACCESS_KEY }
        });
        let data = await response.json();
        showImages(data);
    }

    // Keyboard event: pressing Enter runs the search
    document.getElementById("inputBox").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            searchUsingFetchAwaitAsync();
        }
    });
  </script>
</body>
</html>
